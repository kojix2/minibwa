name: build_arm

on:
  push:
    branches: [master, arm-linux]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: make -j$(nproc)
      - run: make -j$(nproc) -C api-test
      - run: ./minibwa version
